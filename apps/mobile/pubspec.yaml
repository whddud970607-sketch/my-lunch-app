name: delivery_shield_mobile
description: Delivery Shield driver mobile app (Phase 1D auth + session)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.1
  kakao_maps_flutter: ^0.2.2
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  flutter_naver_map: ^1.4.4
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  path_provider: ^2.1.5
  uuid: ^4.5.1
  sqflite: ^2.4.2
  path: ^1.9.1
  crypto: ^3.0.6
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - .env
    - assets/markers/delivery_pin.png
    - assets/markers/driver_truck.png
    - assets/markers/driver_motorcycle.png
    - assets/markers/driver_truck_v2.png
    - assets/markers/driver_motorcycle_v2.png
